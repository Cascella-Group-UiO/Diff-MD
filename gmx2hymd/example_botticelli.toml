# Example Botticelli config for diffmd-analyze.
# Use with: diffmd-analyze ... --botticelli-config gmx2hymd/example_botticelli.toml

[figure]
width = 7.4
height = 4.8
dpi = 350
facecolor = "#fbf7f0"
axes_facecolor = "#fffdf8"

[font]
family = "DejaVu Serif"
size = 12

[legend]
loc = "upper right"
frameon = false

[grid]
enabled = true
linestyle = ":"
alpha = 0.2
linewidth = 0.8

[layout]
tight_pad = 0.55
tight_h_pad = 0.35
tight_w_pad = 0.35

[labels]
aa = "Atomistic target"
epoch138 = "Diff-MD epoch 138"
site0 = "Zn site 0"

[series.aa]
color = "#2f4858"
linewidth = 2.6
linestyle = "-"

[series.epoch138]
color = "#bc6c25"
linewidth = 2.3
linestyle = "--"

[series.site0]
color = "#6d597a"
linewidth = 2.1

[distribution]
show_integral_panel = false
title = "Density Comparison"

[distribution.axes.pdf]
xlabel = "Relative position from center (nm)"
ylabel = "Probability density"
xlim = [-2.5, 2.5]
ylim = [0.0, 1.2]
xticks = [-2.0, -1.0, 0.0, 1.0, 2.0]
ytick_format = "%.1f"

[distribution.layout]
top = 0.92

[[distribution.annotations]]
axis = "pdf"
text = "Bilayer center"
xy = [0.0, 0.95]
xycoords = "data"
xytext = [0.7, 1.05]
textcoords = "data"
arrowprops = { arrowstyle = "->", color = "#2f4858" }
fontsize = 11

[q4.titles]
timeseries = "Backbone CMAP Stability"
distribution = "Q4 Distribution"

[q4.axes.timeseries]
xlabel = "Time (ns)"
ylabel = "Q4"
xlim = [0.0, 100.0]
ylim = [0.7, 1.0]
ytick_format = "%.2f"

[q4.axes.distance_distribution]
xlabel = "Distance (nm)"
ylabel = "P(r)"
xticks = [0.20, 0.22, 0.24, 0.26, 0.28]

[q4.layout]
wspace = 0.28
hspace = 0.30

[[q4.annotations]]
axis = "timeseries"
text = "equilibrated"
xy = [60.0, 0.94]
xycoords = "data"
fontsize = 11