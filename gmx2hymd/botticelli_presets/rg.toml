# Paper-style preset for diffmd-analyze --rg.

[figure]
width = 7.0
height = 5.0
dpi = 350
facecolor = "#fbf7f0"
axes_facecolor = "#fffdf8"

[font]
family = "DejaVu Serif"
size = 12

[legend]
loc = "upper right"
frameon = false

[grid]
enabled = true
linestyle = ":"
alpha = 0.2
linewidth = 0.8

[layout]
tight_pad = 0.55
tight_w_pad = 0.30
tight_h_pad = 0.30

[labels]
target = "Target Rg"
replay_fixed = "Diff-MD replay"
saved = "Saved reference"

[series.target]
color = "#2f4858"
linewidth = 2.5
linestyle = "-"

[series.replay_fixed]
color = "#bc6c25"
linewidth = 2.2
linestyle = "--"

[series.saved]
color = "#6d597a"
linewidth = 2.1
linestyle = "-."

[distribution]
show_integral_panel = true
title = "Radius of Gyration Distribution"
integral_ylabel = "Cumulative probability"

[distribution.axes.pdf]
xlabel = "Radius of gyration (nm)"
ylabel = "Probability density"
ytick_format = "%.2f"

[distribution.axes.integral]
xlabel = "Radius of gyration (nm)"
ylabel = "CDF"
ylim = [0.0, 1.02]
yticks = [0.0, 0.25, 0.50, 0.75, 1.0]

[distribution.layout]
top = 0.92

[[distribution.annotations]]
axis = "integral"
text = "compact"
xy = [0.8, 0.75]
xycoords = "data"
fontsize = 11
