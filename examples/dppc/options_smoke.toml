[simulation]
n_steps = 10
n_print = 5
n_flush = 1
time_step = 0.0005
respa_inner = 1
cancel_com_momentum = true

# temperature
start_temperature = false
target_temperature = 310.15
tau = 1.0
thermostat_coupling_groups = [
    ['C1', 'N4a', 'Q1', 'Q5', 'SN4a'],
    ['W'],
]

# pressure
pressure = false
barostat = "no"

# NON BONDED
coulombtype = "pme"
dielectric_const = 1.0
epsilon_rf = 80
rv = 1.2
rc = 1.1
rlj = 1.1
ns_nlist = 10
nrexcl = 1

[atomistic_ff]
ff_family = "amber_like"
combining_rule = "pairtable"
coulomb14_scale = 0.8333333333
lj14_scale = 0.5
constrain_xh_bonds = false
ensemble = "NVT"

[field]
mesh_size = [20, 20, 20]
kappa = 0.05
sigma = 0.5
rho0 = 8.86

LJ_param = [
[ 'Q1', 'Q5', 4.70e-01, 3.79e+00 ],
[ 'SN4a', 'SN4a', 4.10e-01, 2.60e+00 ],
