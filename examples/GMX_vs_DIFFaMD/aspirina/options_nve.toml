[simulation]
n_steps = 10000                   # 10 ps at 1 fs timestep
n_print = 10                      # Print every 10 fs
n_flush = 10
time_step = 0.001                 # 1 fs
respa_inner = 1
cancel_com_momentum = 100         # Remove COM drift every 100 steps

# NVE: no thermostat
thermostat = "no"
start_temperature = 300            # Generate initial velocities at 300 K
target_temperature = 300.0         # Not used in NVE, but needed by config parser
tau = 0.5
thermostat_coupling_groups = [
    ['c3', 'h1', 'ca', 'ha', 'h4', 'h5', 'c', 'o', 'os', 'oh', 'ho'],
]

#PRESSURE
pressure = false
barostat = "no"

#ELECTROSTATIC
coulombtype = "pme"
dielectric_const = 1.0
epsilon_rf = 80

#NON_BONDED CUT-OFFs
rv = 1.1
rc = 0.9
rlj = 0.9
ns_nlist = 10
nrexcl = 3
skin = 0.2


[atomistic_ff]
ff_family = "amber_like"
combining_rule = "lorentz-berthelot"
lj_input_source = "mixing"
coulomb14_scale = 0.8333333333
lj14_scale = 0.5
constrain_xh_bonds = false
ensemble = "NVE"


[field]
mesh_size = [60, 60, 60]
kappa = 0.05
sigma = 0.5
rho0 = 8.86
a = 9.21
LJ_type_param = [
    [ 'c3',    0.3398,  0.4510   ],
    [ 'h1',    0.2422,  0.0870   ],
    [ 'ca',    0.3315,  0.4134   ],
    [ 'ha',    0.2625,  0.0674   ],
    [ 'h4',    0.2536,  0.0674   ],
    [ 'h5',    0.2447,  0.0674   ],
    [ 'c',    0.3315,  0.4134   ],
    [ 'o',    0.3048,  0.6121   ],
    [ 'os',    0.3156,  0.3038   ],
    [ 'oh',    0.3243,  0.3891   ],
    [ 'ho',    0.0538,  0.0197   ],
]
