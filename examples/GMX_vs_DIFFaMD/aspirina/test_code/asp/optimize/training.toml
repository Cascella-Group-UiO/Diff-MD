[nn]
systems = ["."]
n_epochs = 1
equilibration = 0
teacher_forcing = false
chain = false
shuffle = false

[nn.optimizer]
name = "adam"
learning_rate = 0.01

[nn.loss]
name = "radius_of_gyration"
metric = "mse"
target_rg = 1.5
rg_weight = 1.0
constraint = "harmonic"
k_constraint = 0.01
boundary = 50

[nn.system_args."."]
n_chains = 1
resname = "Protein_chain_X"

[nn.model]
# Type-based differentiable LJ training for N and H atom types.
# Both sigma and epsilon are trainable (separately) for N and H.
# All other types are fixed (no flags).
train_sigma = false

LJ_type_param = [
    ["N3",     3.25e-01,  7.11e-01],
